version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agendacero_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agendacero_db}
      POSTGRES_USER: ${POSTGRES_USER:-agendacero_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendacero_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agendacero_user} -d ${POSTGRES_DB:-agendacero_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: agendacero_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local-dev-key}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-agendacero_user}:${POSTGRES_PASSWORD:-agendacero_password}@db:5432/${POSTGRES_DB:-agendacero_db}
      POSTGRES_DB: ${POSTGRES_DB:-agendacero_db}
      POSTGRES_USER: ${POSTGRES_USER:-agendacero_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendacero_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      CELERY_BROKER_URL: redis://redis:6379/0

  redis:
    image: redis:7-alpine
    container_name: agendacero_redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: agendacero_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local-dev-key}
      DEBUG: ${DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-agendacero_db}
      POSTGRES_USER: ${POSTGRES_USER:-agendacero_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendacero_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0

volumes:
  postgres_data:
  static_volume:
